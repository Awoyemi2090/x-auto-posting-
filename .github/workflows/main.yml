name: Post to X

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, or upload_test (only tests the image upload)"
        default: "normal"
        type: choice
        options:
          - normal
          - upload_test

permissions:
  contents: write

concurrency:
  group: x-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python x_bot.py
        env:
          RUN_MODE: ${{ inputs.mode || 'normal' }}
          FEED_URL: ${{ secrets.FEED_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Save seen_x.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen_x.json ]; then git add seen_x.json; fi
          git diff --staged --quiet || (git commit -m "Update seen_x.json" && git push)
          
